<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scribble Date 💕</title><style>body{font-family:system-ui;max-width:900px;margin:auto;padding:18px;background:#fff7fb;color:#29232b}section{background:#fff;border:1px solid #eadde5;border-radius:20px;padding:18px;margin:12px 0}button{padding:11px 15px;border:0;border-radius:12px;background:#ff5c93;color:white;font-weight:700;margin:4px}input,select{padding:11px;border:1px solid #eadde5;border-radius:11px;box-sizing:border-box;width:100%;margin:4px 0}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.hidden{display:none}canvas{width:100%;background:white;border:1px solid #eadde5;border-radius:15px;touch-action:none}@media(max-width:650px){.row{grid-template-columns:1fr}}</style></head><body><section><h1>🎨 Scribble Date 💕</h1><p>English ↔ Vietnamese drawing & guessing for two.</p><div id="home"><div class="row"><div><h3>Create room</h3><input id="hn" value="Harsh"><select id="hl"><option value="en">🇬🇧 English</option><option value="vi">🇻🇳 Tiếng Việt</option></select><button id="create">Create room</button></div><div><h3>Join room</h3><input id="gn" value="My Love"><p>Language</p><button id="v" style="background:#ff5c93">🇻🇳 Tiếng Việt</button><button id="e" style="background:#fff;color:#29232b;border:1px solid #eadde5">🇬🇧 English</button><input id="code" placeholder="Room code"><button id="join">Join room</button></div></div></div><div id="room" class="hidden"><h2>Room: <span id="rc"></span></h2><p id="rs">Waiting…</p><button id="start" disabled>Start game</button></div><div id="game" class="hidden"><h3 id="turn"></h3><h2 id="word"></h2><canvas id="cv" width="900" height="600"></canvas><input id="guess" placeholder="Type your guess"><button id="gb">Guess</button><h3>💬 Chat</h3><div id="chat"></div><input id="msg" placeholder="Message"><button id="cb">Send</button></div></section><script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script><script>
const P=[["cat","con mèo"],["dog","con chó"],["umbrella","cái ô"],["sun","mặt trời"],["moon","mặt trăng"],["flower","bông hoa"],["tree","cây"],["house","ngôi nhà"],["car","ô tô"],["bicycle","xe đạp"],["phone","điện thoại"],["coffee","cà phê"],["pizza","pizza"],["banana","quả chuối"],["apple","quả táo"],["bird","con chim"],["fish","con cá"],["rabbit","con thỏ"],["heart","trái tim"],["rain","mưa"],["rainbow","cầu vồng"],["mountain","ngọn núi"],["beach","bãi biển"],["train","tàu hỏa"],["camera","máy ảnh"],["gift","món quà"],["cake","bánh ngọt"],["key","chìa khóa"],["love","tình yêu"],["hug","cái ôm"]];
let peer,conn,host=false,me,other,target,artist=false,lang="vi";const $=id=>document.getElementById(id), norm=x=>x.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d").trim();function show(x){$("home").classList.toggle("hidden",x!="home");$("room").classList.toggle("hidden",x!="room");$("game").classList.toggle("hidden",x!="game")}function send(x){if(conn?.open)conn.send(x)}function setup(c){conn=c;c.on("open",()=>{send({t:"hello",p:me});$("rs").textContent="Connected ❤️"});c.on("data",m=>{if(m.t=="hello"&&host){other=m.p;$("rs").textContent="Your friend is connected 💗";$("start").disabled=false}if(m.t=="start"){target=m.target;artist=m.artist;begin()}if(m.t=="draw"){line(m.a,m.b,false)}if(m.t=="chat")chat(m.n,m.x,m.y)});c.on("error",e=>$("rs").textContent="Connection error: "+e.type)}function np(id){peer=new Peer(id,{host:"0.peerjs.com",port:443,path:"/"});peer.on("error",e=>alert("Connection problem: "+e.type));return peer}
$("v").onclick=()=>lang="vi";$("e").onclick=()=>lang="en";$("create").onclick=()=>{host=true;me={name:$("hn").value||"Harsh",lang:$("hl").value};np("SD"+Math.random().toString(36).slice(2,8).toUpperCase());peer.on("open",id=>{$("rc").textContent=id.slice(2);show("room")});peer.on("connection",setup)};$("join").onclick=()=>{let c=$("code").value.trim().toUpperCase();if(!c)return alert("Enter the room code.");me={name:$("gn").value||"My Love",lang};show("room");$("rs").textContent="Connecting…";np().on("open",()=>setup(peer.connect("SD"+c,{reliable:true})))};
$("start").onclick=()=>{target=P[Math.floor(Math.random()*P.length)];artist=true;send({t:"start",target,artist});begin()};function begin(){show("game");$("turn").textContent=artist?"Your turn — draw!":"Her turn — guess!";$("word").textContent=artist?(me.lang=="vi"?target[1]:target[0]):"🤔 Guess it!"}
const cv=$("cv"),ctx=cv.getContext("2d");let down=false,last;function pt(e){let r=cv.getBoundingClientRect(),q=e.touches?.[0]||e;return{x:(q.clientX-r.left)*900/r.width,y:(q.clientY-r.top)*600/r.height}}function line(a,b,sendit=true){ctx.strokeStyle="#29232b";ctx.lineWidth=6;ctx.lineCap="round";ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();if(sendit)send({t:"draw",a,b})}cv.onpointerdown=e=>{if(artist){down=true;last=pt(e)}};cv.onpointermove=e=>{if(down){let q=pt(e);line(last,q);last=q}};cv.onpointerup=()=>down=false;$("gb").onclick=()=>{let g=$("guess").value.trim();if(host&&g){let ok=[target[0],target[1]].some(x=>norm(g)==norm(x));$("turn").textContent=ok?"🎉 Correct!":"Try again!"}else if(g)send({t:"guess",g})};async function trans(x){try{let u="https://translate.googleapis.com/translate_a/single?client=gtx&sl="+me.lang+"&tl="+(other?.lang||"en")+"&dt=t&q="+encodeURIComponent(x);let j=await(await fetch(u)).json();return j[0].map(a=>a[0]).join("")}catch(e){return x}}function chat(n,x,y){$("chat").innerHTML+="<p><b>"+n+":</b> "+x+"<br><small>"+y+"</small></p>"}$("cb").onclick=async()=>{let x=$("msg").value.trim();if(!x)return;$("msg").value="";let y=await trans(x);chat(me.name,x,y);send({t:"chat",n:me.name,x,y})};
</script></body></html>
